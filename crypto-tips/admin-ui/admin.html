<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Admin · Signal Tips</title>
<link rel="icon" href="/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; --bg: #0b0c0f; --card: #13151a; --card2: #181b21; --text: #eef0f3; --dim: #8a919e; --alt: #1d2027; --panel: #0f1115; --border: #23262e; --line: #2c3039;
    --accent: #4c82ff; --accent-bg: #15244a; --buy: #2bbd7e; --buy-bg: #0e2a1f; --sell: #f2626f; --sell-bg: #331418; --warn: #e6a93b; --warn-bg: #2e230e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 Inter, system-ui, sans-serif; color: var(--text); background: var(--panel); }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  header nav button { background: none; border: 0; font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 999px; color: var(--dim); cursor: pointer; }
  header nav button.on { background: var(--accent-bg); color: var(--accent); }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  .stat b { display: block; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .stat span { color: var(--dim); font-size: 13px; }
  .section { margin-top: 18px; }
  .muted { color: var(--dim); } .small { font-size: 13px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--alt); color: var(--dim); }
  .p-owner { background: #eef0f3; color: #0b0c0f; } .p-subscription { background: var(--buy-bg); color: var(--buy); } .p-comp { background: var(--accent-bg); color: var(--accent); }
  .p-trial { background: var(--warn-bg); color: var(--warn); } .p-lapsed, .p-sus { background: var(--sell-bg); color: var(--sell); }
  .svc { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--alt); } .svc:last-child { border: 0; }
  .ok { color: var(--buy); font-weight: 600; } .off { color: var(--sell); font-weight: 600; }
  button.b, a.b { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 8px 14px; background: var(--alt); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
  button.b.primary { background: var(--accent); color: #fff; } button.b.danger { background: var(--sell-bg); color: var(--sell); }
  button.b:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--card); color: var(--text); }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--dim); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--alt); vertical-align: top; }
  tr.sel td { background: #161d30; }
  .tablewrap { overflow-x: auto; }
  .detail { margin-top: 10px; background: var(--panel); border-radius: 12px; padding: 12px; }
  .detail .row { margin-top: 8px; }
  .msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--buy-bg); color: var(--buy); font-weight: 500; }
  .msg.err { background: var(--sell-bg); color: var(--sell); }
  .temp { font-family: ui-monospace, monospace; font-size: 16px; background: var(--card); border: 1px dashed var(--border); padding: 6px 10px; border-radius: 8px; user-select: all; }
  .info { margin-top: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .info-grid > div { display: grid; gap: 2px; }
  .info-sec { margin-top: 12px; } .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  table.mini { margin-top: 4px; font-size: 13px; } table.mini td, table.mini th { padding: 4px 8px; }
  /* Moderation */
  .mod { margin-top: 12px; border: 1px solid #4a2328; background: linear-gradient(180deg, #1a1215, #fff); border-radius: 14px; padding: 14px 16px; display: grid; gap: 12px; }
  .mod-head { display: flex; align-items: center; gap: 12px; } .mod-head > div { display: grid; flex: 1; } .mod-head b { font-size: 16px; } .mod-head span { font-size: 13px; color: var(--dim); }
  .mod-icon { font-size: 22px; width: 40px; height: 40px; border-radius: 12px; background: var(--sell-bg); display: grid; place-items: center; }
  .mod-field { display: grid; gap: 6px; } .mod-field > span { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); }
  .mod-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip:hover { border-color: #7a3a42; } .chip.on { background: #eef0f3; color: #0b0c0f; border-color: #eef0f3; } .chip.perm.on { background: var(--sell); border-color: var(--sell); }
  .chip-input { width: 120px; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .mod-note { width: 100%; }
  .mod-toggle { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--dim); } .mod-toggle input { margin-top: 3px; } .mod-toggle b { color: var(--text); }
  .mod-summary { font-size: 14px; background: var(--card); border: 1px dashed #4a2328; border-radius: 10px; padding: 8px 12px; }
  .b.mod-ban { background: var(--sell); color: #fff; justify-self: start; padding: 10px 22px; } .b.mod-ban.armed { background: #b3202e; box-shadow: 0 0 0 3px #5a1f26; }
  .mod-banned { border-color: var(--sell); background: linear-gradient(180deg, var(--sell-bg), #fff); } .mod-banned .mod-icon { background: var(--sell); }
  .mod-count { font-size: 13px; font-weight: 700; color: var(--sell); background: var(--sell-bg); border-radius: 999px; padding: 4px 10px; white-space: nowrap; } .mod-count.perm { background: #eef0f3; color: #0b0c0f; }
  .mod-reason { display: grid; gap: 2px; background: var(--card); border-radius: 10px; padding: 8px 12px; border: 1px solid #4a2328; } .mod-reason span { font-size: 12px; color: var(--dim); }
  .mod-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .b.mod-lift { background: #eef0f3; color: #0b0c0f; }
  .ban-list { display: grid; gap: 8px; } .ban-item { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .ban-item .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--sell-bg); color: var(--sell); display: grid; place-items: center; font-weight: 700; flex: none; }
  .ban-who { display: grid; flex: 1; min-width: 0; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--panel); padding: 10px; border-radius: 10px; margin: 0; }
  .gate { max-width: 440px; margin: 80px auto; text-align: center; }
  .links a { display: block; padding: 8px 0; color: var(--accent); font-weight: 500; text-decoration: none; border-bottom: 1px solid var(--alt); }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } .grid > .card:not(.stat) { grid-column: 1 / -1; } .stat b { font-size: 24px; } header nav { margin-left: 0; width: 100%; overflow-x: auto; flex-wrap: nowrap; } .hide-sm { display: none; } }

  /* Console layout: sidebar + content */
  body { background: var(--bg); }
  .shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; background: #0f1115; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; } .brand b { font-size: 16px; display: block; } .brand span { font-size: 11px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
  .side nav { display: grid; gap: 2px; }
  .side nav button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; color: var(--dim); font: inherit; font-weight: 600; font-size: 14px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .side nav button:hover { background: var(--alt); color: var(--text); }
  .side nav button.on { background: var(--accent-bg); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
  .side nav button i { font-style: normal; width: 20px; text-align: center; font-size: 15px; }
  .side .grp { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #5d6470; padding: 14px 12px 4px; }
  .side-foot { margin-top: auto; display: grid; gap: 8px; padding: 12px; border-top: 1px solid var(--border); font-size: 13px; }
  .trusted { display: flex; align-items: center; gap: 8px; color: var(--buy); font-weight: 600; } .trusted small { display: block; color: var(--dim); font-weight: 400; }
  .side-foot a, .side-foot button { color: var(--dim); background: none; border: 0; padding: 0; font: inherit; text-align: left; cursor: pointer; text-decoration: none; } .side-foot a:hover, .side-foot button:hover { color: var(--text); }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 18px 28px 0; }
  .topbar h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .topbar .live { margin-left: auto; font-size: 12px; color: var(--buy); display: flex; align-items: center; gap: 6px; } .topbar .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--buy); box-shadow: 0 0 0 3px var(--buy-bg); }
  main { max-width: 1240px; margin: 0; padding: 18px 28px 60px; }
  .card { background: var(--card); border-color: var(--border); }
  .stat { background: linear-gradient(180deg, var(--card2), var(--card)); } .stat b { font-variant-numeric: tabular-nums; }
  input, select, textarea { background: var(--panel); color: var(--text); border-color: var(--line); }
  button.b { background: var(--alt); color: var(--text); } button.b:hover { filter: brightness(1.2); } button.b.primary { background: var(--accent); color: #fff; }
  th { color: var(--dim); border-color: var(--border); } td { border-color: var(--border); }
  .detail { background: #10131a; border: 1px solid var(--border); }
  .info, .mod-summary, .mod-reason { background: var(--card); border-color: var(--border); }
  .chip { background: var(--card); color: var(--text); border-color: var(--line); }
  pre, .temp { background: var(--panel); color: var(--text); }
  .msg { background: var(--buy-bg); } .msg.err { background: var(--sell-bg); }
  /* Sign-in / trust screens */
  .lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(800px 400px at 50% -10%, #17244d, transparent 70%), var(--bg); }
  .lock-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px; display: grid; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .lock-card h2 { margin: 0; font-size: 22px; } .lock-card p { margin: 0; color: var(--dim); }
  .lock-card label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--dim); } .lock-card input { padding: 12px 14px; font-size: 15px; }
  .lock-card .go { font: inherit; font-weight: 700; padding: 13px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .lock-card .err { color: var(--sell); font-size: 14px; min-height: 1em; }
  .lock-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-bg); display: grid; place-items: center; font-size: 26px; }
  /* Site controls */
  .ctl { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--border); } .ctl:first-of-type { border-top: 0; }
  .ctl > div:first-child { display: grid; gap: 2px; flex: 1; } .ctl b { font-size: 15px; } .ctl span { font-size: 13px; color: var(--dim); }
  .tgl { width: 50px; height: 28px; border-radius: 999px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; }
  .tgl i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; }
  .tgl.on { background: var(--buy); } .tgl.on i { left: 25px; } .tgl.danger.on { background: var(--sell); }
  .ctl input[type=number] { width: 110px; }
  .warn-banner { background: var(--sell-bg); border: 1px solid #5a1f26; color: #ffb3ba; border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
  .log-row { display: grid; grid-template-columns: 150px 120px 160px 1fr; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--border); font-size: 13px; }
  .log-row code { color: var(--accent); }
  @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px; } .brand { padding: 4px 8px; } .side nav { display: flex; overflow-x: auto; width: 100%; } .side nav button { white-space: nowrap; width: auto; } .side .grp, .side-foot { display: none; } main, .topbar { padding-left: 14px; padding-right: 14px; } .log-row { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
<div id="app"><div class="lock"><p class="muted">Loading…</p></div></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const when = (t) => (t ? new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "–");
  const ago = (t) => { if (!t) return "never"; const m = Math.round((Date.now() - t) / 60000); return m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };
  const PLAN = { owner: "Owner", subscription: "Pro (paid)", comp: "Pro (free)", trial: "Trial", free: "Free", lapsed: "Lapsed", guest: "Guest" };
  const planPill = (r) => `<span class="pill p-${esc(r.plan)}">${esc(PLAN[r.plan] || r.plan)}</span>${r.suspended ? ' <span class="pill p-sus">Suspended</span>' : ""}`;

  async function api(op, body) {
    const r = await fetch(`/api/account?action=admin&op=${op}`, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d.reason || "HTTP " + r.status), { status: r.status, needTrust: Boolean(d.needTrust) });
    return d;
  }

  let tab = "overview", data = null, users = null, selected = null, flash = null;
  const show = (html) => { $("main").innerHTML = html; };
  const flashHtml = () => (flash ? `<div class="msg${flash.err ? " err" : ""}">${flash.html}</div>` : "");

  // ── Overview ──
  function renderOverview() {
    const d = data, s = d.services, by = d.byPlan || {};
    const svc = (name, on, note) => `<div class="svc"><span>${name}</span><span class="${on ? "ok" : "off"}">${on ? "On" : "Off"}${note ? ` <span class="muted small">${esc(note)}</span>` : ""}</span></div>`;
    show(`
      <div class="grid">
        <div class="card stat"><b>${d.users}</b><span>accounts</span></div>
        <div class="card stat"><b>${d.signups.last7d}</b><span>new in 7 days (${d.signups.last24h} today)</span></div>
        <div class="card stat"><b>${d.activeToday ?? 0}</b><span>active today (${d.activeLast7d} this week)</span></div>
        <div class="card stat"><b>${(by.subscription || 0) + (by.comp || 0) + (by.trial || 0)}</b><span>with Pro (${by.subscription || 0} paid · ${by.comp || 0} free · ${by.trial || 0} trial)</span></div>
        <div class="card stat"><b>${d.aiQuestionsThisMonth}</b><span>AI questions this month</span></div>
        <div class="card stat"><b>${d.push.devices}</b><span>devices with notifications</span></div>
        <div class="card stat"><b>$${d.cryptoPayments?.last30dUsd ?? 0}</b><span>crypto payments, 30 days ($${d.cryptoPayments?.usdTotal ?? 0} all time, ${d.cryptoPayments?.count ?? 0} payments)</span></div>
      </div>
      <div class="grid section" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">
        <div class="card"><h2>Services</h2>
          ${svc("Account storage", s.storage)}
          ${svc("Ask AI", s.ai, s.ai ? `${s.aiProvider === "gemini" ? "Gemini" : "Claude"} · ${s.aiModel}` : "add GEMINI_API_KEY in Vercel")}
          ${svc("Payments (Stripe)", s.payments, s.payments ? "" : "add STRIPE_SECRET_KEY + STRIPE_PRICE_ID")}
          ${svc("Crypto payments", s.cryptoPayments, s.cryptoPayments ? "" : "add CRYPTO_SOL_ADDRESS / CRYPTO_ETH_ADDRESS / CRYPTO_BTC_ADDRESS")}
          ${svc("Web push notifications", s.webPush)}
          ${svc("iPhone app notifications", s.iphonePush, s.iphonePush ? "" : "add APNS_* keys")}
        </div>
        <div class="card"><h2>Plans</h2>
          ${Object.entries(by).map(([k, n]) => `<div class="svc"><span>${esc(PLAN[k] || k)}</span><b>${n}</b></div>`).join("") || '<p class="muted">No accounts yet.</p>'}
          <p class="muted small" style="margin:10px 0 0">Signups in 30 days: ${d.signups.last30d}</p>
        </div>
        <div class="card"><h2>Coins people get notified about</h2>
          ${d.push.topCoins.map((c) => `<div class="svc"><span>${esc(c.sym)}</span><span class="muted">${c.devices} device${c.devices > 1 ? "s" : ""}</span></div>`).join("") || '<p class="muted">Nobody has turned notifications on yet.</p>'}
          <p class="muted small" style="margin:10px 0 0">Last sell-plan check: ${ago(d.push.lastCheck)} · ${d.push.iphoneApp} iPhone app · ${d.push.browsers} browser</p>
        </div>
      </div>
      ${d.cryptoPayments?.recent?.length ? `<div class="card section"><h2>Recent crypto payments</h2>${d.cryptoPayments.recent.map((p) => `<div class="svc"><span><b>${esc(p.user)}</b> · ${esc(p.amount)} ${esc(p.method.toUpperCase())}</span><span class="muted small">$${p.usd} · ${ago(p.at)}</span></div>`).join("")}</div>` : ""}
      ${d.announcement ? `<div class="card section"><h2>Live announcement</h2><p style="margin:0">${esc(d.announcement.text)}</p><p class="muted small">Since ${ago(d.announcement.at)}</p></div>` : ""}`);
  }

  // ── Users ──
  function renderUsers() {
    const q = ($("uq")?.value || "").toLowerCase(), f = $("uf")?.value || "all";
    const list = (users || []).filter((u) => (!q || u.name.toLowerCase().includes(q)) && (f === "all" || (f === "pro" ? u.pro : f === "suspended" ? u.suspended : u.plan === f)));
    const sel = users?.find((u) => u.id === selected);
    const detail = (u) => `<tr class="sel"><td colspan="7"><div class="detail">
        <b>${esc(u.name)}</b> ${planPill(u)}
        <div class="muted small">Joined ${when(u.created)} · last sign-in ${ago(u.lastLogin)} · ${u.aiUsed} AI questions this month${u.trialEnds ? ` · trial ${u.trialEnds > Date.now() ? "ends" : "ended"} ${when(u.trialEnds)}` : ""}${u.comp ? ` · free Pro ${u.comp.until ? "until " + when(u.comp.until) : "with no end date"}` : ""}${u.subscription ? " · has a Stripe subscription" : ""}</div>
        ${infoHtml(u)}
        ${u.owner ? '<p class="muted small" style="margin:8px 0 0">Owner accounts already have everything, and can\'t be suspended, deleted or have their password reset here.</p>' : `
        <div class="row"><span class="small muted">Free Pro:</span>
          <button class="b" data-act="grantPro" data-days="7">7 days</button><button class="b" data-act="grantPro" data-days="30">30 days</button>
          <button class="b" data-act="grantPro" data-days="365">1 year</button><button class="b" data-act="grantPro" data-forever="1">Forever</button>
          ${u.comp ? '<button class="b danger" data-act="revokePro">Remove free Pro</button>' : ""}</div>
        <div class="row"><span class="small muted">Other:</span>
          <button class="b" data-act="extendTrial" data-days="7">Extend trial 7 days</button>
          <button class="b" data-act="resetAi">Reset AI questions</button>
          <button class="b" data-act="resetPassword">Temporary password</button>
          <button class="b" data-act="signOut">Sign out everywhere</button>
          <button class="b danger" data-act="delete">Delete account</button></div>
        ${modHtml(u)}`}
        ${flash ? flashHtml() : ""}
      </div></td></tr>`;
    show(`<div class="card">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">Users <span class="muted small">(${list.length} of ${users?.length ?? 0})</span></h2>
        <div class="row"><input id="uq" placeholder="Search name or email" value="${esc($("uq")?.value || "")}" />
        <select id="uf">${[["all", "Everyone"], ["pro", "Has Pro"], ["subscription", "Paid"], ["comp", "Free Pro"], ["trial", "Trial"], ["free", "Free"], ["suspended", "Suspended"], ["owner", "Owners"]].map(([v, t]) => `<option value="${v}"${v === f ? " selected" : ""}>${t}</option>`).join("")}</select>
        <button class="b" id="ureload">Refresh</button></div></div>

        const ov = document.createElement("div");
        ov.innerHTML = tone === "emergency"
          ? `<div style="position:fixed;inset:0;z-index:99;background:#d50000;color:#fff;display:grid;place-items:center;padding:24px;text-align:center"><div style="max-width:900px"><div style="display:inline-block;font-weight:800;letter-spacing:.12em;border:3px solid #fff;border-radius:999px;padding:6px 18px">⚠ IMPORTANT</div><h1 style="font-size:clamp(40px,9vw,110px);line-height:1.02;margin:24px 0">${esc(text)}</h1><p>Preview: only you can see this. Visitors see it after you publish.</p><button class="b" style="background:#fff;color:#b00000;font-size:20px;padding:14px 36px">Close preview</button></div></div>`
          : `<div style="position:fixed;left:0;right:0;top:0;z-index:99;padding:12px;text-align:center;font-weight:500;background:${tone === "good" ? "#e6f4ec" : tone === "warn" ? "#fff3dc" : "#e8efff"}">${esc(text)} <button class="b">Close preview</button></div>`;
        ov.querySelector("button").onclick = () => ov.remove();
        document.body.appendChild(ov);
        return;
      }
      if (btn.id === "asave" || btn.id === "aclear") {
        if (btn.id === "asave" && $("atone").value === "emergency" && btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Tap again to turn everyone's screen red"; return; }
        const r = await api("announce", btn.id === "aclear" ? { text: "" } : { text: $("atext").value, tone: $("atone").value });
        let extra = "";
        if (r.announcement && $("apush")?.checked) {
          try { const p = await api("broadcast", { title: r.announcement.tone === "emergency" ? "⚠ Important" : "Signal Tips", body: r.announcement.text }); extra = ` Push sent to ${p.sent} device${p.sent === 1 ? "" : "s"}.`; }
          catch (pe) { extra = " Push not sent: " + esc(pe.message); }
        }
        data.announcement = r.announcement; flash = { html: (r.announcement ? (r.announcement.tone === "emergency" ? "Emergency screen is live. Open the site in a new tab to check: it shows straight away there, and within about 15 seconds for anyone who already has it open." : "Published. Visitors see it straight away, or within about 15 seconds if they already have the site open.") : "Removed.") + extra };
        return renderAnnounce();
      }
      if (btn.id === "nsend") {
        const title = $("ntitle").value.trim();
        if (!title) return $("ntitle").focus();
        if (!confirm(`Send "${title}" to ${data.push.devices} devices?`)) return;
        btn.disabled = true;
        const r = await api("broadcast", { title, body: $("nbody").value });
        flash = { html: `Sent to ${r.sent} device${r.sent === 1 ? "" : "s"}${r.failed ? `, ${r.failed} failed` : ""}${r.removed ? `, ${r.removed} no longer subscribed (removed)` : ""}.` };
        return renderNotify();
      }
      if (btn.id === "nrun") {
        btn.disabled = true; btn.textContent = "Checking…";
        const r = await api("pushcheck", {});
        data.push.lastCheck = Date.now();
        flash = { html: r.ok ? `Checked ${r.subscriptions} devices and ${r.coins} coins. Sent ${r.sent} notification${r.sent === 1 ? "" : "s"}.` : esc(r.reason || "Not set up.") };
        return renderNotify();
      }
      if (btn.id === "tdiag") {
        btn.disabled = true; btn.textContent = "Running…";
        const r = await api("diag");
        $("tdiagout").innerHTML = `<p class="small">Provider: <b>${esc(r.provider)}</b> · model <b>${esc(r.model)}</b></p>` +
          (r.steps || []).map((s) => `<div class="svc"><span>${s.ok ? "✓" : "✗"} ${esc(s.step)}</span><span class="muted small">${s.ms} ms</span></div>${s.ok ? (s.result ? `<pre>${esc(s.result)}</pre>` : "") : `<pre style="color:var(--sell)">${esc((s.status ? s.status + ": " : "") + s.error)}</pre>`}`).join("") +
          (r.steps?.length ? "" : '<p class="muted small">No Gemini key set, so there was nothing to test.</p>');
        btn.disabled = false; btn.textContent = "Run AI check again";
      }
    } catch (err) {
      btn.disabled = false;
      flash = { err: true, html: esc(err.message) };
      RENDER[tab]();
    }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "uq") { e.target.dataset.focus = "1"; const pos = e.target.selectionStart; renderUsers(); const n = $("uq"); n.focus(); n.setSelectionRange(pos, pos); } });
  document.addEventListener("change", async (e) => {
    if (e.target.dataset?.text === "maintenanceMessage") { siteCfg = (await api("settings", { maintenanceMessage: e.target.value })).settings; flash = { html: "Message saved." }; return renderControls(); }
    if (e.target.id === "uf") renderUsers();
    if (e.target.id === "banCustom" && +e.target.value >= 1) { banDur = Math.min(3650, Math.round(+e.target.value)); banNote = $("banNote")?.value || banNote; renderUsers(); }
  });

  // ── Getting in: sign in, then trust this computer once ──
  const raw = (action, body) => fetch("/api/account?action=" + action, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {})
    .then(async (r) => ({ status: r.status, d: await r.json().catch(() => ({})) }));
  const SITE = location.hostname.endsWith("vercel.app") ? "https://signal-tips.vercel.app/" : "/";
  let who = null;
  function lock(html) { $("app").innerHTML = `<div class="lock"><form class="lock-card" novalidate>${html}</form></div>`; $("app").querySelector("input")?.focus(); }
  function signInScreen(err = "") {
    lock(`<div class="lock-icon">🔐</div><h2>Signal Tips Control</h2><p>Admin sign-in. This page isn't linked from the public site.</p>
      <label>Username<input name="u" autocomplete="username" autocapitalize="none" spellcheck="false" /></label>
      <label>Password<input name="p" type="password" autocomplete="current-password" /></label>
      <p class="err">${esc(err)}</p><button class="go">Sign in</button>`);
    $("app").querySelector("form").onsubmit = async (e) => {
      e.preventDefault(); const f = e.target;
      const r = await raw("login", { email: f.u.value.trim(), password: f.p.value });
      if (r.status !== 200) return signInScreen(r.d.reason || "Couldn't sign in.");
      boot();
    };
  }
  function trustScreen(err = "") {
    const guess = (/Mac/.test(navigator.userAgent) ? "Mac" : /Windows/.test(navigator.userAgent) ? "Windows PC" : /iPhone|iPad/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android phone" : /CrOS/.test(navigator.userAgent) ? "Chromebook" : "Computer");
    lock(`<div class="lock-icon">💻</div><h2>Trust this computer?</h2><p>Signed in as <b>${esc(who?.username || "")}</b>. Admin controls only work on devices you trust, so a stolen password alone isn't enough. Only do this on your own computer.</p>
      <label>Name this device<input name="n" value="${esc(guess)}" maxlength="40" /></label>
      <label>Confirm your password<input name="p" type="password" autocomplete="current-password" /></label>
      <p class="err">${esc(err)}</p><button class="go">Trust this computer</button>
      <button type="button" class="b" data-signout>Sign out</button>`);
    $("app").querySelector("form").onsubmit = async (e) => {
      e.preventDefault(); const f = e.target;
      const r = await raw("adminTrust", { password: f.p.value, name: f.n.value });
      if (r.status !== 200) return trustScreen(r.d.reason || "Couldn't trust this device.");
      boot();
    };
  }
  function consoleShell() {
    const NAV = [["Monitor", [["overview", "📊", "Overview"], ["users", "👥", "Users"], ["bans", "⛔", "Bans"]]],
      ["Communicate", [["announce", "📣", "Announcements"], ["notify", "🔔", "Notifications"]]],
      ["Control", [["controls", "🎛️", "Site controls"], ["devices", "💻", "Trusted devices"], ["audit", "🧾", "Activity log"], ["tools", "🧰", "Tools"]]]];
    $("app").innerHTML = `<div class="shell">
      <aside class="side">
        <div class="brand"><img src="/icon.svg" width="34" height="34" alt="" /><div><b>Signal Tips</b><span>Control</span></div></div>
        <nav id="tabs">${NAV.map(([g, items]) => `<div class="grp">${g}</div>${items.map(([id, ic, t]) => `<button data-tab="${id}"><i>${ic}</i>${t}</button>`).join("")}`).join("")}</nav>
        <div class="side-foot">
          <div class="trusted">✓<div>Trusted device<small>${esc(who.device || "")} · ${esc(who.username || "")}</small></div></div>
          <a href="${SITE}" target="_blank" rel="noopener">Open the public site ↗</a>
          <button data-signout>Sign out</button>
        </div>
      </aside>
      <div><div class="topbar"><h1 id="ttl">Overview</h1><span class="live"><i></i>Live</span></div><main id="main"><p class="muted">Loading…</p></main></div>
    </div>`;
  }
  async function boot() {
    const r = await raw("adminWho");
    if (r.status === 404) { $("app").innerHTML = '<div class="lock"><p class="muted">Not found.</p></div>'; return; }
    who = r.d;
    if (!who.admin) return signInScreen(who.username ? "That account isn't the admin account." : "");
    if (!who.deviceTrusted) return trustScreen();
    consoleShell();
    try { data = await api("overview"); go("overview"); }
    catch (e) { if (e.needTrust) return trustScreen(); show(`<p class="msg err">${esc(e.message)}</p>`); }
  }
  document.addEventListener("click", async (e) => {
    if (e.target.closest("[data-signout]")) { await raw("logout", {}); location.reload(); }
  });
  boot();
})();
</script>
</body>
</html>
